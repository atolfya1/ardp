name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Configure Windows RDP
      # ============================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Configuring Remote Desktop"
          Write-Host "========================================"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Use standard RDP security
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Remove previous firewall rule
          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" `
            >$null 2>&1

          # Allow RDP only from the Tailscale IPv4 range
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."


      # ============================================================
      # 2. Create RDP User
      # ============================================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD secret is not configured."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Remove existing user
          Remove-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          # Create new user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -ErrorAction Stop

          # Administrator access
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          # RDP access
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user created successfully."


      # ============================================================
      # 3. Install Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host "========================================"
          Write-Host "Installing Tailscale"
          Write-Host "========================================"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/quiet", "/norestart" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 15

          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe",
            "$env:LOCALAPPDATA\Tailscale\tailscale.exe"
          )

          $tailscaleExe = $null

          foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                  $tailscaleExe = $path
                  break
              }
          }

          if (-not $tailscaleExe) {

              Write-Host "Searching for tailscale.exe..."

              $found = Get-ChildItem `
                -Path "C:\Program Files","C:\Program Files (x86)" `
                -Recurse `
                -Filter "tailscale.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $tailscaleExe = $found.FullName
              }
          }

          if (-not $tailscaleExe) {
              Write-Error "tailscale.exe was not found."
              exit 1
          }

          Write-Host "Tailscale executable:"
          Write-Host $tailscaleExe

          Write-Host ""
          Write-Host "Tailscale version:"
          & $tailscaleExe version

          echo "TAILSCALE_EXE=$tailscaleExe" >> $env:GITHUB_ENV


      # ============================================================
      # 4. Authenticate Tailscale + Advertise Exit Node
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale = $env:TAILSCALE_EXE

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is not configured."
              exit 1
          }

          Write-Host "========================================"
          Write-Host "Connecting to Tailscale"
          Write-Host "========================================"

          & $tailscale up `
            --auth-key=$env:TAILSCALE_AUTH_KEY `
            --hostname="gh-runner-$env:GITHUB_RUN_ID" `
            --accept-routes `
            --accept-dns=true `
            --unattended=true `
            --advertise-exit-node

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale authentication successful."

          # Explicitly enable Exit Node advertisement
          & $tailscale set --advertise-exit-node=true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to advertise Exit Node."
              exit 1
          }

          Write-Host "Exit Node advertisement enabled."

          # Wait for Tailscale IP
          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null | Out-String).Trim()

              if ($tsIP -and $tsIP -match '^\d+\.\d+\.\d+\.\d+$') {
                  break
              }

              Write-Host "Waiting for Tailscale IP... $($i + 1)/30"

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {

              Write-Error "Tailscale IP was not assigned."

              Write-Host ""
              Write-Host "Tailscale status:"
              & $tailscale status

              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Tailscale connected"
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Exit Node: ADVERTISED"
          Write-Host "========================================"


      # ============================================================
      # 5. Network / DERP Diagnostics
      # ============================================================
      - name: Tailscale Network Diagnostics
        shell: powershell
        run: |

          $tailscale = $env:TAILSCALE_EXE

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       TAILSCALE NETWORK DIAGNOSTICS"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "===== TAILSCALE IP ====="
          & $tailscale ip -4

          Write-Host ""
          Write-Host "===== TAILSCALE NETCHECK ====="
          & $tailscale netcheck

          Write-Host ""
          Write-Host "===== TAILSCALE STATUS ====="
          & $tailscale status

          Write-Host ""
          Write-Host "===== TAILSCALE EXIT NODE ====="
          & $tailscale exit-node list

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Diagnostics completed"
          Write-Host "========================================"


      # ============================================================
      # 6. Verify Tailscale IP + RDP
      # ============================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Testing RDP"
          Write-Host "========================================"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error "TCP connection to RDP port 3389 failed."

              Write-Host ""
              Write-Host "Detailed result:"
              $testResult

              exit 1
          }

          Write-Host ""
          Write-Host "RDP port 3389 is accessible."


      # ============================================================
      # 7. Final Information
      # ============================================================
      - name: Display Access Information
        if: success()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP ACCESS INFORMATION"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : RDP"
          Write-Host "Password     : GitHub Secret RDP_PASSWORD"
          Write-Host ""
          Write-Host "Exit Node    : ENABLED / ADVERTISED"
          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 8. Keep Runner Alive
      # ============================================================
      - name: Keep Runner Alive
        if: success()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RUNNER IS ACTIVE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : RDP"
          Write-Host "Exit Node    : ENABLED"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner active..."

              Start-Sleep -Seconds 600
          }
