name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          
          # Configure firewall for RDP
          netsh advfirewall firewall delete rule name="RDP-Tailscale" >$null 2>&1
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          # Restart the Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "Amirali.138800"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # حذف کاربر قبلی اگر وجود داشته باشد
          Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "User RDP created successfully"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          
          Write-Host "Installing Tailscale..."
          Start-Process -FilePath $installerPath -ArgumentList "/quiet", "/norestart" -Wait -NoNewWindow
          
          # صبر کن تا نصب کامل بشه
          Start-Sleep -Seconds 15
          
          # پیدا کردن مسیر tailscale.exe
          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe",
            "$env:LOCALAPPDATA\Tailscale\tailscale.exe"
          )
          
          $tailscaleExe = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $tailscaleExe = $path
              break
            }
          }
          
          if (-not $tailscaleExe) {
            Write-Host "Searching for tailscale.exe..."
            $found = Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter "tailscale.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $tailscaleExe = $found.FullName
            }
          }
          
          if (-not $tailscaleExe) {
            Write-Error "Tailscale executable not found after installation"
            exit 1
          }
          
          Write-Host "Tailscale found at: $tailscaleExe"
          & $tailscaleExe version
          
          echo "TAILSCALE_EXE=$tailscaleExe" >> $env:GITHUB_ENV

      - name: Establish Tailscale Connection
        run: |
          $tailscale = $env:TAILSCALE_EXE
          
          Write-Host "Connecting to Tailscale..."
          & $tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-routes
          
          # Wait for IP
          $tsIP = $null
          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = & $tailscale ip -4 2>$null
              if ($tsIP -and $tsIP -match '\d+\.\d+\.\d+\.\d+') {
                  break
              }
              Write-Host "Waiting for Tailscale IP... attempt $($i+1)"
              Start-Sleep -Seconds 5
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              & $tailscale status
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          
          Write-Host "TCP connectivity to port 3389 successful!"

      - name: Keep Runner Alive
        if: always()
        run: |
          Write-Host "`n========================================"
          Write-Host "===          RDP ACCESS            ==="
          Write-Host "========================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "========================================`n"
          
          # Infinite loop to keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP session is active..."
              Start-Sleep -Seconds 600
          }
